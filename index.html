</style>

<script>
(()=>{'use strict';
/* ===== 設定 ===== */
const API_KEY="AIzaSyD-9mMx8oO546Dk2XKxHsOfbvwGJGsDHck"; // Google Drive API のキー

/* ================ */
const API="https://www.googleapis.com/drive/v3/files",FM="application/vnd.google-apps.folder",ALL="\0all";
const $=s=>document.querySelector(s),
E=Object.fromEntries(['hero','hm','hi','hb','hd','msg','st','ah','al','rail','grid','gt','gc','gal','vw','vi','vf','vn','vt2','vg','vd','mg','ml'].map(k=>[k,$('#'+k)]));
const ic=(d,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`,
DL=ic('<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'),PLAY=ic('<path d="M8 5v14l11-7z" fill="currentColor"/>',16);
$('#vx').innerHTML=ic('<path d="M6 6l12 12M18 6L6 18"/>');$('#vp').innerHTML=ic('<path d="M15 5l-7 7 7 7"/>');$('#vnx').innerHTML=ic('<path d="M9 5l7 7-7 7"/>');
E.vd.innerHTML=DL+'<span class="lb">ダウンロード</span>';

/* 期限までの日数(日本時間) ※12月31日(11は12月を意味します)に更新 */
{const j=new Date(Date.now()+324e5),n=Math.round((Date.UTC(2026,11,31)-Date.UTC(j.getUTCFullYear(),j.getUTCMonth(),j.getUTCDate()))/864e5);
document.querySelectorAll('.cd').forEach(e=>e.textContent=n>0?`あと${n}日`:n===0?'本日が最終日':'期限を過ぎています')}

/* 解析 */
const fid=t=>{t=(t||'').trim();return(t.match(/\/folders\/([\w-]{10,})/)||t.match(/[?&]id=([\w-]{10,})/)||t.match(/^([\w-]{20,})$/)||[])[1]||null};
const shot=n=>{const m=n.match(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/);if(!m)return null;const[,y,o,d,h,i,s]=m;
if(+o<1||+o>12||+d<1||+d>31||+h>23||+i>59||+s>59)return null;return{date:`${y}.${o}.${d}`,time:`${h}:${i}:${s}`,k:+(y+o+d+h+i+s)}};

/* Google Drive API */
async function gf(u){const r=await fetch(u);if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(_){}const e=new Error(m||'HTTP '+r.status);e.status=r.status;throw e}return r.json()}
async function ls(id){const o=[];let t='';do{const p=new URLSearchParams({q:`'${id}' in parents and trashed=false`,
fields:'nextPageToken,files(id,name,mimeType,thumbnailLink,imageMediaMetadata(width,height,rotation),videoMediaMetadata(width,height))',
pageSize:'1000',orderBy:'name',supportsAllDrives:'true',includeItemsFromAllDrives:'true',key:API_KEY});
if(t)p.set('pageToken',t);const d=await gf(`${API}?${p}`);o.push(...d.files);t=d.nextPageToken||''}while(t);return o}

/* サブサブフォルダ対応：区切り文字を「 ＞ 」にして分かりやすく */
function mk(f,p,rn){const m=f.imageMediaMetadata||f.videoMediaMetadata||{};let w=m.width,h=m.height;if(m.rotation%2)[w,h]=[h,w];
const r=Math.min(Math.max(w&&h?w/h:4/3,.5),2.4);
const jp=p.join(' ＞ '), pp=p.slice(0,-1).join(' ＞ ');
return{id:f.id,name:f.name,v:f.mimeType[0]==='v',r,t:f.thumbnailLink||null,s:shot(f.name),key:p.length?jp:rn,nm:p.length?p[p.length-1]:rn,par:pp}}

// サブフォルダを再帰的にたどる(同時6リクエストまで)
function crawl(root,rn,prog){const out=[],q=[{id:root,p:[]}];let run=0,bad=0;
return new Promise((res,rej)=>{const pump=()=>{while(!bad&&run<6&&q.length){const j=q.shift();run++;
ls(j.id).then(it=>{for(const f of it){if(f.mimeType===FM)q.push({id:f.id,p:[...j.p,f.name]});else if(/^(image|video)\//.test(f.mimeType||''))out.push(mk(f,j.p,rn))}prog(out.length)})
.catch(e=>{if(!bad){bad=1;rej(e)}}).finally(()=>{run--;if(bad)return;!q.length&&!run?res(out):pump()})}};pump()})}

/* 画像 */
const iu=(p,z)=>p.t?p.t.replace(/=s\d+(-c)?$/,'=s'+z):`https://drive.google.com/thumbnail?id=${p.id}&sz=w${z}`;
function im(p,z,alt){const i=new Image();i.alt=alt;i.decoding='async';i.loading='lazy';i.referrerPolicy='no-referrer';i.onload=()=>i.classList.add('on');
i.onerror=()=>{if(!i.f){i.f=1;i.src=`https://drive.google.com/thumbnail?id=${p.id}&sz=w${z}`}};i.src=iu(p,z);return i}
const pre=(p,z)=>{const b=new Image();b.referrerPolicy='no-referrer';b.src=iu(p,z);return b};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

/* ダウンロード */
async function dl(p,b){const l=b.querySelector('.lb'),o=l&&l.textContent,set=t=>{if(l)l.textContent=t},
fin=()=>setTimeout(()=>{b.dataset.s='';b.disabled=false;set(o)},1800),dr=`https://drive.google.com/uc?export=download&id=${p.id}`;b.disabled=true;
if(p.v){const a=el('a');a.href=dr;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();b.dataset.s='done';set('開始しました');return fin()}
b.dataset.s='busy';set('保存中…');
try{const r=await fetch(`${API}/${p.id}?alt=media&supportsAllDrives=true&key=${API_KEY}`);if(!r.ok)throw 0;
const u=URL.createObjectURL(await r.blob()),a=el('a');a.href=u;a.download=p.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15e3);b.dataset.s='done';set('保存しました')}
catch(_){window.open(dr,'_blank','noopener');set(o)}
fin()}

/* 状態 */
let all=[],vis=[],albums=[],vi=0;
const say=(t,k='')=>{E.msg.textContent=t;if(k==='err'){E.hm.hidden=true;E.hero.classList.add('np')}};
const why=e=>e.code?'フォルダのリンクではありません。':e.status===404?'フォルダが見つかりません。リンクを確認してください。'
:e.status===401||e.status===403?`読み込めませんでした。フォルダの共有設定が「リンクを知っている全員」か確認してください。（${e.message}）`
:e instanceof TypeError?'ネットワークに接続できません。再読み込みしてください。':`エラーが発生しました。（${e.message}）`;

async function load(){
 const id=fid(FOLDER_URL);
 if(!id||id.startsWith('YOUR_'))return say('フォルダのリンクが未設定です。index.html の FOLDER_URL を設定してください。','err');
 if(API_KEY.startsWith('YOUR_'))return say('APIキーが未設定です。index.html の API_KEY を設定してください。','err');
 say('写真と動画を読み込んでいます…');
 try{
  const m=await gf(`${API}/${id}?${new URLSearchParams({fields:'name,mimeType',supportsAllDrives:'true',key:API_KEY})}`);
  if(m.mimeType!==FM)throw Object.assign(new Error(''),{code:1});
  const l=await crawl(id,m.name,n=>say(`読み込み中… ${n}件見つかりました`));
  l.sort((a,b)=>a.s&&b.s?a.s.k-b.s.k||a.name.localeCompare(b.name):a.s?-1:b.s?1:a.name.localeCompare(b.name,'ja'));
  const hx=l.findIndex(p=>!p.v&&HERO_NAME.test(p.name)),hero=hx<0?null:l.splice(hx,1)[0];
  all=l;heroSet(hero);
  if(!all.length)return say(hero?'集合写真のほかに、写真・動画は見つかりませんでした。':'このフォルダには写真・動画が見つかりませんでした。');
  const d=all.find(p=>p.s);if(d){E.hd.textContent=d.s.date;E.hd.hidden=false}
  build();say('');
 }catch(e){console.error(e);say(why(e),'err')}
}

function heroSet(p){
 if(!p){E.hm.hidden=true;E.hero.classList.add('np');return}
 const i=E.hi;i.onload=()=>{E.hm.style.setProperty('--hr',`${i.naturalWidth}/${i.naturalHeight}`);i.classList.add('on')};
 i.onerror=()=>{if(!i.f){i.f=1;i.src=`https://drive.google.com/thumbnail?id=${p.id}&sz=w2000`}};i.src=iu(p,2000);
 E.hb.innerHTML=DL+'<span class="lb">集合写真を保存</span>';E.hb.hidden=false;E.hb.onclick=()=>dl(p,E.hb)}

function build(){
 const by=new Map();all.forEach(p=>{if(!by.has(p.key))by.set(p.key,{key:p.key,nm:p.nm,par:p.par,it:[]});by.get(p.key).it.push(p)});
 albums=[...by.values()].sort((a,b)=>a.key.localeCompare(b.key,'ja',{numeric:true}));
 const multi=albums.length>1,nv=all.filter(p=>p.v).length,dup=new Set(albums.map(a=>a.nm).filter((n,i,x)=>x.indexOf(n)!==i)),lb=a=>dup.has(a.nm)?a.key:a.nm;
 E.st.innerHTML=(multi?[[albums.length,'アルバム']]:[]).concat([[all.length-nv,'写真'],[nv,'動画']]).map(([n,t])=>`<div><b>${n}</b>${t}</div>`).join('');
 E.ah.textContent=multi?'アルバム':'写真と動画';E.al.hidden=E.rail.hidden=!multi;
 E.al.replaceChildren(...albums.map(a=>{
  const li=el('li'),b=el('button','al');b.type='button';b.dataset.k=a.key;
  const t=a.it.filter(p=>p.s).map(p=>p.s.time.slice(0,5)),s=el('span','ai');
  if(a.par)s.append(el('small','par',a.par));
  s.append(el('strong','',lb(a)),el('small','',`${a.it.length}件`+(t.length?` ${t[0]}〜${t[t.length-1]}`:'')));
  b.append(im(a.it.find(p=>!p.v)||a.it[0],480,''),s);b.onclick=()=>pick(a.key,1);li.append(b);return li}));
 E.rail.replaceChildren(...[[ALL,'すべて',all.length],...albums.map(a=>[a.key,lb(a),a.it.length])].map(([k,t,n])=>{
  const b=el('button','chip',t);b.type='button';b.dataset.k=k;b.append(el('small','',n));b.onclick=()=>pick(k);return b}));
 E.mg.hidden=!multi;E.ml.replaceChildren(...albums.map(a=>{const b=el('button','',lb(a));b.type='button';b.onclick=()=>{menu(false);pick(a.key,1)};return b}));
 pick(ALL,0,1)}

function pick(k,smooth,init){
 document.querySelectorAll('.chip,.al').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.k===k)));
 vis=k===ALL?all:all.filter(p=>p.key===k);
 const nv=vis.filter(p=>p.v).length;
 E.gt.textContent=k===ALL?'すべての写真と動画':k;E.gc.textContent=`写真${vis.length-nv}枚`+(nv?` 動画${nv}本`:'');
 E.grid.classList.toggle('sub',k!==ALL);E.grid.replaceChildren(...vis.map(tile));
 if(init)return;
 const c=E.rail.querySelector('.chip[aria-pressed=true]');if(c)E.rail.scrollTo({left:c.offsetLeft-E.rail.clientWidth/2+c.offsetWidth/2,behavior:'smooth'});
 if(smooth||E.gal.getBoundingClientRect().top<0)E.gal.scrollIntoView({behavior:smooth?'smooth':'auto',block:'start'})}

function tile(p,i){
 const li=el('li','tile'),o=el('button','op'),ov=el('div','ov'),tx=el('div'),tm=el('time'),b=el('button','ib');
 li.style.setProperty('--r',p.r.toFixed(3));o.type=b.type='button';
 o.setAttribute('aria-label',`${full(p)}の${p.v?'動画を再生':'写真を拡大'}`);o.append(im(p,640,p.nm));
 if(p.v){const v=el('span','vb');v.innerHTML=PLAY;o.append(v)}
 o.onclick=()=>openV(i);
 if(p.s){tm.append(el('span','dd',p.s.date+' '),p.s.time)}else tm.textContent='撮影日時不明';
 tx.append(tm,el('em','',p.key));
 b.innerHTML=DL;b.setAttribute('aria-label','ダウンロード');b.onclick=()=>dl(p,b);
 ov.append(tx,b);li.append(el('span','ph'),o,ov);return li}

/* 拡大表示 */
function show(n){vi=(n+vis.length)%vis.length;const p=vis[vi];
 E.vn.textContent=`${vi+1} / ${vis.length}`;E.vt2.textContent=full(p);E.vg.textContent=p.key;
 if(p.v){E.vi.hidden=true;E.vi.removeAttribute('src');E.vf.src=`https://drive.google.com/file/d/${p.id}/preview`;E.vf.hidden=false}
 else{E.vf.hidden=true;E.vf.src='about:blank';E.vi.hidden=false;E.vi.alt=p.nm;E.vi.src=iu(p,640);
  const b=pre(p,1600);b.onload=()=>{if(vis[vi]===p)E.vi.src=b.src};const nx=vis[(vi+1)%vis.length];if(nx&&!nx.v)pre(nx,1600)}
 $('#vp').hidden=$('#vnx').hidden=vis.length<2}
function openV(i){show(i);document.body.style.overflow='hidden';E.vw.showModal()}
$('#vp').onclick=()=>show(vi-1);$('#vnx').onclick=()=>show(vi+1);$('#vx').onclick=()=>E.vw.close();E.vd.onclick=()=>dl(vis[vi],E.vd);
E.vw.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(vi-1);if(e.key==='ArrowRight')show(vi+1)});
E.vw.addEventListener('close',()=>{document.body.style.overflow='';E.vi.removeAttribute('src');E.vf.src='about:blank'});
{let x=0,y=0;const s=$('#vs');s.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
s.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-x,dy=t.clientY-y;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)show(vi+(dx<0?1:-1))},{passive:true})}

/* メニュー・ナビ */
const mn=$('#menu'),bg=$('#bg');
function menu(o){mn.hidden=!o;bg.setAttribute('aria-expanded',String(o));bg.setAttribute('aria-label',o?'メニューを閉じる':'メニューを開く');document.body.style.overflow=o?'hidden':''}
bg.onclick=()=>menu(mn.hidden);
mn.addEventListener('click',e=>{if(e.target.closest('a'))menu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!mn.hidden)menu(false)});
matchMedia('(min-width:900px)').addEventListener('change',e=>e.matches&&menu(false));
{const L=[...document.querySelectorAll('.nav a')],M={hero:'#top',albums:'#albums',gal:'#gal'},
io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)L.forEach(a=>a.getAttribute('href')===M[e.target.id]?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'))}),{rootMargin:'-45% 0px -50% 0px'});
Object.keys(M).forEach(k=>io.observe($('#'+k)))}

load();
})();
</script>
</body>
